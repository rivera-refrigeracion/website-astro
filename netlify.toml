[build]
  command = "pnpm install && pnpm build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  PNPM_VERSION = "9"

# Redirecciones 301 del blog
#
# Los artículos colgaban de la raíz y pasaron a /blog/ para que el silo
# temático sea legible (auditoría 2026-09-22, M4). Estas tres URL son las que
# ya estaban publicadas e indexadas: hay que conservarlas mientras existan
# enlaces externos apuntando a ellas. Los artículos nuevos nacen bajo /blog/ y
# no necesitan una entrada aquí.

[[redirects]]
  from = "/por-que-tu-aire-acondicionado-no-enfria-bien/"
  to = "/blog/por-que-tu-aire-acondicionado-no-enfria-bien/"
  status = 301
  force = true

[[redirects]]
  from = "/como-saber-si-tu-nevera-necesita-mantenimiento/"
  to = "/blog/como-saber-si-tu-nevera-necesita-mantenimiento/"
  status = 301
  force = true

[[redirects]]
  from = "/5-errores-comunes-al-usar-lavadoras-y-como-evitarlos/"
  to = "/blog/5-errores-comunes-al-usar-lavadoras-y-como-evitarlos/"
  status = 301
  force = true

# Security Headers
#
# connect-src cubre los cinco destinos reales de GA4, no sólo
# www.google-analytics.com: el enrutamiento regional sale por
# region1.google-analytics.com, Google Signals por analytics.google.com y por
# stats.g.doubleclick.net, y GTM abre sus propias conexiones a
# www.googletagmanager.com (auditoría 2026-09-22, M9).
#
# Dos huecos que dejaba esa lista, vistos en la consola de producción: el
# comodín *.analytics.google.com no cubre analytics.google.com a secas, y
# GA4 también envía los hits a www.google.com/g/collect. Ambos quedaban
# bloqueados.
#
# Las fuentes ya no vienen de Google Fonts sino de /fonts, así que style-src
# y font-src se quedan en 'self'.
#
# Cloudflare Insights sigue deliberadamente fuera de script-src: hoy su beacon
# se carga en cada visita y la CSP lo bloquea siempre. La decisión de apagarlo
# o permitirlo es de Juan y está planteada en
# docs/CLOUDFLARE-RASTREADORES-IA.md.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), payment=(), interest-cohort=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://chatwoot.jjuanrivvera.com https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: https:; connect-src 'self' https://*.google-analytics.com https://analytics.google.com https://*.analytics.google.com https://www.google.com https://stats.g.doubleclick.net https://www.googletagmanager.com https://chatwoot.jjuanrivvera.com wss://chatwoot.jjuanrivvera.com https://cloudflareinsights.com; frame-src https://chatwoot.jjuanrivvera.com; frame-ancestors 'none'"
    Content-Language = "es"

# HTML: No cache (always revalidate)
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Astro hashed assets: Aggressive caching (1 year, immutable)
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# JavaScript: Long cache
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# CSS: Long cache
[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Images: Long cache
[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Fonts: Long cache
[[headers]]
  for = "/*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.woff"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Favicon: Medium cache (1 week)
[[headers]]
  for = "/favicon.*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# RSS feed: Short cache (1 hour)
[[headers]]
  for = "/rss.xml"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# Sitemap: Short cache (1 hour)
[[headers]]
  for = "/sitemap*.xml"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# robots.txt: Medium cache (1 day)
[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=86400"
